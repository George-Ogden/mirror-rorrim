[project]
name = "mirror-rorrim"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license-files = ["LICENSE"]
authors = [{ name = "George Ogden" }]
dependencies = [
  "click>=8,<9",
  "extra-type-helpers>=0.8.4",
  "gitpython>=3.1.46",
  "loguru>=0.4,<0.8",
  "more-itertools>=9,<12",
  "platformdirs>=2,<5",
  "pyyaml>=4,<7",
]
dynamic = ["version"]

[project.scripts]
mirror = "mirror:main_cli"

[dependency-groups]
dev = [
  "py-spy",
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "types" },
]
docs = [
  "mkdocs<2",
  "mkdocs-material",
  "mkdocstrings",
]
lint = [
  "linter==2.1.3",
  "prek",
  "ruff==0.17.2",
  "semgrep==1.181.1",
]
test = [
  "inline-snapshot",
  "pre-commit",
  "pytest>=9.0.0",
  "pytest-dbg ; python_full_version >= '3.11'",
  "pytest-timeout",
  { include-group = "utils" },
]
types = [
  "mypy",
  "mypy-pytest-plugin ; python_full_version >= '3.12'",
  { include-group = "test" },
]
utils = [
  "extra-type-helpers ; python_full_version >= '3.12'",
  "georges-utils ; python_full_version >= '3.12'",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { file = ["version.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["mirror*"]
exclude = ["test*"]

[tool.uv.sources]
extra-type-helpers = { git = "https://github.com/George-Ogden/extra-types" }
georges-utils = { git = "https://github.com/George-Ogden/utils" }
linter = { git = "https://github.com/George-Ogden/linter/" }
mypy-pytest-plugin = { git = "https://github.com/George-Ogden/mypy-pytest" }
pytest-dbg = { git = "https://github.com/George-Ogden/pytest-dbg" }
