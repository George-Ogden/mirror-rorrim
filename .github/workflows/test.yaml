name: Run Python Tests

on:
  push:
    branches:
      - m
  pull_request:
    branches:
      - m

jobs:
  run-pytest-lowest:
    uses: George-Ogden/actions/.github/workflows/python-test.yaml@v5.2.1
    with:
      python-versions: "['3.15']"
      pytest-flags: -vv -m "not local"
      package-resolution: lowest-direct

  run-pytest-highest:
    uses: George-Ogden/actions/.github/workflows/python-test.yaml@v5.2.1
    with:
      python-versions: "['3.15']"
      pytest-flags: -vv -m "not local"
      package-resolution: highest
